{%  extends 'base.html' %}

{%  block title %}
Головна
{%  endblock %}

{%  block content %}
<h1>Головна</h1>
<div style="display: flex; flex-wrap: wrap; justify-content: flex-start; gap: 20px; padding: 20px;">
    {% for item in items %}
    <div style="border: 1px solid #ccc; padding: 10px; border-radius: 8px; width: 300px;">
        <h3>{{ item.title }}</h3>
        <img src="{{ url_for('get_gif', id=item.id) }}" style="width: 100%; height: 250px; object-fit: cover; border-radius: 4px;">
    </div>
    {% endfor %}
</div>

{%  endblock %}
