{%  extends 'base.html' %}

{%  block title %}
Гіф
{%  endblock %}

{%  block content %}
<h1>Відправити гіфку</h1>

<form action="/sendgif" method="POST" class="form-control" enctype="multipart/form-data">
    <input type="text" name="title" placeholder="Назва" class="form-control"><br>
    <input type="file" name="gif_file" placeholder="Закиньте гіф" class="form-control"><br>
    <button class="btn btn--success" type="send">Відправити</button>
</form>

{%  endblock %}
