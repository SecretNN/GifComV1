{%  extends 'base.html' %}

{%  block title %}
Регалка
{%  endblock %}

{%  block content %}
<div style="max-width: 400px; margin: 50px auto; padding: 20px; border: 1px solid #ccc; border-radius: 10px;">
    <h2>Реєстрація</h2>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label">Новий логін</label>
            <input type="text" name="username" class="form-control" required placeholder="Придумайте нікнейм">
        </div>
        <div class="mb-3">
            <label class="form-label">Пароль</label>
            <input type="password" name="password" class="form-control" required placeholder="Придумайте пароль">
        </div>
        <button type="submit" class="btn btn-success w-100">Створити аккаунт</button>
    </form>
    <p class="mt-3 text-center">Вже є аккаунт? <a href="{{ url_for('login') }}">Увійти</a></p>
</div>

{%  endblock %}
